<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <!-- Six Track: the batter in his stance, a right-hander seen from behind and to the side: crouched,
       bent at the hips, bottom back, knees bent, the bat held up toward the bowler. Original artwork. -->
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1B3A9C"/><stop offset="0.45" stop-color="#2E5BDA"/><stop offset="1" stop-color="#5A86F4"/>
    </linearGradient>
    <linearGradient id="trouser" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#172F7C"/><stop offset="0.5" stop-color="#2546AE"/><stop offset="1" stop-color="#3D63CC"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3C7D2"/><stop offset="0.45" stop-color="#F2F2EC"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9744F"/><stop offset="1" stop-color="#E0AC84"/>
    </linearGradient>
    <radialGradient id="helmet" cx="0.6" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4A63B8"/><stop offset="0.45" stop-color="#1B2A6A"/><stop offset="1" stop-color="#0E1640"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A87438"/><stop offset="0.5" stop-color="#D9A464"/><stop offset="1" stop-color="#F0C890"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C8CCD8"/>
    </linearGradient>
  </defs>
  <g stroke="#101833" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="116" cy="284" rx="56" ry="8" fill="#000" fill-opacity="0.22" stroke="none"/>

    <!-- the bat, held up and forward, toward the bowler: behind the near arm -->
    <path d="M150 138 L158 128 L196 72 Q200 66 206 70 L210 74 Q213 79 208 84 L170 140 L162 146 Z" fill="url(#wood)"/>
    <path d="M168 132 L202 80" stroke="#F6DDB0" stroke-width="2" fill="none"/>
    <path d="M174 124 L184 110" stroke="#2E5BDA" stroke-width="7" fill="none"/>
    <path d="M140 160 L152 142 L160 148 L148 166 Z" fill="#26262C"/>

    <!-- front (left) leg: thigh forward, pad, shoe pointing down the crease -->
    <path d="M96 168 Q116 176 130 200 L118 212 Q104 196 88 186 Z" fill="url(#trouser)"/>
    <path d="M116 202 Q114 236 118 266 L134 266 Q138 236 134 204 Q126 196 116 202 Z" fill="url(#pad)"/>
    <path d="M122 208 L123 260 M128 207 L130 261" stroke="#B8BCC8" stroke-width="1.4" fill="none"/>
    <path d="M117 224 L136 224 M117 246 L136 246" stroke="#3A3E4C" stroke-width="2.4" fill="none"/>
    <ellipse cx="125" cy="203" rx="10" ry="7" fill="url(#pad)"/>
    <path d="M114 266 Q112 276 120 278 L146 278 Q150 272 140 266 Z" fill="#F7F7F7"/>
    <path d="M113 277 L148 277" stroke="#2A2C36" stroke-width="2.6"/>

    <!-- back (right) leg, nearer us -->
    <path d="M74 172 Q96 184 108 210 L94 220 Q80 200 66 188 Z" fill="url(#trouser)"/>
    <path d="M92 210 Q88 244 92 274 L108 274 Q112 244 110 212 Q102 204 92 210 Z" fill="url(#pad)"/>
    <path d="M97 216 L98 268 M103 215 L104 269" stroke="#B8BCC8" stroke-width="1.4" fill="none"/>
    <path d="M92 232 L111 232 M92 254 L110 254" stroke="#3A3E4C" stroke-width="2.4" fill="none"/>
    <ellipse cx="101" cy="211" rx="11" ry="8" fill="url(#pad)"/>
    <path d="M88 274 Q86 285 94 287 L122 287 Q126 281 116 274 Z" fill="#F7F7F7"/>
    <path d="M87 286 L124 286" stroke="#2A2C36" stroke-width="2.8"/>

    <!-- the seat, pushed back over the heels -->
    <path d="M60 160 Q50 180 62 194 Q80 204 104 192 Q114 180 108 162 Q84 150 60 160 Z" fill="url(#trouser)"/>

    <!-- the back, bent forward from the hips, curving over toward the bowler -->
    <path d="M58 166 Q54 132 76 108 Q98 88 128 92 Q146 96 148 112 Q144 134 126 152 Q108 170 88 174 Q70 176 58 166 Z" fill="url(#shirt)"/>
    <path d="M72 124 Q92 116 116 104" stroke="#1C3A9A" stroke-width="1.4" fill="none"/>
    <path d="M70 150 Q96 144 120 128" stroke="#1C3A9A" stroke-width="1.4" fill="none"/>
    <path d="M84 100 Q104 90 126 92" stroke="#F5C030" stroke-width="3.2" fill="none"/>
    <text x="96" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22"
          fill="#F5C030" stroke="#101833" stroke-width="1.2" transform="rotate(-24 96 140)">7</text>

    <!-- the near (right) arm, down and forward to the hands at the waist; the gloves on the handle -->
    <path d="M118 100 Q136 104 140 120 L128 128 Q122 116 112 112 Z" fill="url(#shirt)"/>
    <path d="M138 118 Q146 132 146 146 L134 150 Q132 138 128 128 Z" fill="url(#skin)"/>
    <path d="M136 146 Q132 158 142 164 Q152 168 158 158 Q160 148 150 144 Q140 142 136 146 Z" fill="url(#glove)"/>
    <path d="M146 136 Q156 132 162 140 Q166 150 158 154 Q150 156 146 148 Z" fill="url(#glove)"/>
    <path d="M139 152 L153 158 M141 157 L153 162" stroke="#AEB3C2" stroke-width="1.2" fill="none"/>

    <!-- neck and helmet, looking down the pitch: dome, peak and grille toward the bowler, neck guard back -->
    <path d="M122 98 Q126 88 136 88 Q142 92 140 100 Z" fill="url(#skin)"/>
    <path d="M118 74 Q120 52 142 50 Q162 52 164 72 Q164 88 148 92 Q126 94 118 74 Z" fill="url(#helmet)"/>
    <path d="M120 78 Q124 92 140 94 L136 100 Q120 98 114 84 Z" fill="#14205A"/>
    <path d="M160 64 Q176 66 178 76 L164 78 Z" fill="#1B2A6A"/>
    <path d="M164 78 L176 78 L172 94 L160 94 Z" fill="none" stroke="#A8ACB8" stroke-width="1.6"/>
    <path d="M166 84 L174 84 M164 90 L172 90" stroke="#A8ACB8" stroke-width="1.4"/>
    <path d="M120 68 Q140 74 162 66" stroke="#F5C030" stroke-width="3" fill="none"/>
    <ellipse cx="146" cy="58" rx="7" ry="4" fill="#FFFFFF" fill-opacity="0.25" stroke="none"/>
  </g>
</svg>
