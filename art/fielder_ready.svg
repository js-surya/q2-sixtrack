<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Six Track: a fielder facing us, ready, crouched and walking in. Cap, shirt, trousers, spikes: no pads. Original artwork. -->
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#4FD08A"/><stop offset="0.55" stop-color="#21A560"/><stop offset="1" stop-color="#146C3E"/>
    </linearGradient>
    <linearGradient id="trouser" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#2E9C5C"/><stop offset="0.6" stop-color="#1D7C46"/><stop offset="1" stop-color="#125530"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A07A"/><stop offset="1" stop-color="#9C6844"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#E6B08A"/><stop offset="1" stop-color="#A26E4A"/>
    </radialGradient>
    <radialGradient id="cap" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#3BAE6E"/><stop offset="0.5" stop-color="#18804A"/><stop offset="1" stop-color="#0E5530"/>
    </radialGradient>
  </defs>
  <g stroke="#0F2018" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="100" cy="286" rx="52" ry="8" fill="#000" fill-opacity="0.22" stroke="none"/>

    <!-- legs: knees bent, feet apart, weight forward -->
    <path d="M78 168 Q64 196 70 222 Q72 250 66 272 L84 274 Q90 248 88 224 Q94 198 96 174 Z" fill="url(#trouser)"/>
    <path d="M104 174 Q108 198 112 224 Q110 248 116 274 L134 272 Q128 250 130 222 Q136 196 122 168 Z" fill="url(#trouser)"/>
    <path d="M80 226 Q78 214 86 204 M114 204 Q122 214 120 226" stroke="#0E4A28" stroke-width="1.4" fill="none"/>
    <!-- spikes -->
    <path d="M60 272 Q56 284 66 286 L88 286 Q92 278 84 271 Z" fill="#F7F7F7"/>
    <path d="M58 285 L90 285" stroke="#24282E" stroke-width="2.6"/>
    <path d="M114 271 Q106 278 110 286 L134 286 Q144 284 140 272 Z" fill="#F7F7F7"/>
    <path d="M108 285 L142 285" stroke="#24282E" stroke-width="2.6"/>

    <!-- shirt: leaning forward toward us -->
    <path d="M70 176 Q62 140 70 112 Q84 96 100 96 Q116 96 130 112 Q138 140 130 176 Q100 186 70 176 Z" fill="url(#shirt)"/>
    <path d="M86 104 L100 118 L114 104" stroke="#F4F4F4" stroke-width="3" fill="none"/>
    <path d="M100 118 L100 140" stroke="#0F5C34" stroke-width="1.4" fill="none"/>
    <circle cx="114" cy="132" r="5" fill="#F4F4F4" stroke-width="1.4"/>
    <path d="M80 160 Q100 166 120 160" stroke="#0F5C34" stroke-width="1.4" fill="none"/>

    <!-- arms: short sleeves, forearms down to the hands at the knees -->
    <path d="M72 112 Q58 118 56 138 L70 142 Q72 126 80 118 Z" fill="url(#shirt)"/>
    <path d="M57 138 Q54 160 64 182 L76 178 Q70 160 70 142 Z" fill="url(#skin)"/>
    <ellipse cx="70" cy="186" rx="8" ry="7" fill="url(#skin)"/>
    <path d="M128 112 Q142 118 144 138 L130 142 Q128 126 120 118 Z" fill="url(#shirt)"/>
    <path d="M143 138 Q146 160 136 182 L124 178 Q130 160 130 142 Z" fill="url(#skin)"/>
    <ellipse cx="130" cy="186" rx="8" ry="7" fill="url(#skin)"/>

    <!-- head: neck, face looking at the bat, cap with its peak toward us -->
    <path d="M92 98 L92 88 L108 88 L108 98 Z" fill="url(#skin)"/>
    <ellipse cx="100" cy="72" rx="19" ry="21" fill="url(#face)"/>
    <ellipse cx="81" cy="74" rx="4" ry="6" fill="url(#skin)"/>
    <ellipse cx="119" cy="74" rx="4" ry="6" fill="url(#skin)"/>
    <ellipse cx="93" cy="74" rx="2.6" ry="3.2" fill="#1E1612" stroke="none"/>
    <ellipse cx="107" cy="74" rx="2.6" ry="3.2" fill="#1E1612" stroke="none"/>
    <path d="M88 67 Q93 64 97 67 M103 67 Q107 64 112 67" stroke="#3A2618" stroke-width="1.6" fill="none"/>
    <path d="M95 84 Q100 87 105 84" stroke="#6E3E26" stroke-width="1.6" fill="none"/>
    <path d="M80 62 Q80 40 100 38 Q120 40 120 62 Z" fill="url(#cap)"/>
    <path d="M78 62 Q100 74 122 62 Q118 54 100 56 Q82 54 78 62 Z" fill="#0E5530"/>
    <circle cx="100" cy="39" r="2.4" fill="#F4F4F4" stroke-width="1"/>
    <ellipse cx="92" cy="47" rx="6" ry="3" fill="#FFFFFF" fill-opacity="0.25" stroke="none"/>
  </g>
</svg>
